<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>팡팡 퀴즈 LIVE 🎉</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><style>
:root{font-family:Pretendard,'Apple SD Gothic Neo',system-ui,sans-serif;color:#fff;background:#130c2d}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 20% 0%,#4f1da0 0,transparent 52%),radial-gradient(ellipse at 90% 75%,#123c9b 0,transparent 50%),#130c2d;overflow-x:hidden}button,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:14px 23px;font-weight:850;transition:transform .12s,filter .12s}button:hover{filter:brightness(1.12)}button:active{transform:scale(.97)}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#fdd447;color:#21113d}.secondary{background:#fff2;color:white;border:1px solid #fff4}.danger{background:#e84269;color:white}input,textarea{background:#fff;color:#231641;border-radius:12px;border:2px solid transparent;padding:12px;width:100%;outline:none}input:focus,textarea:focus{border-color:#fbc83e}.wrap{width:min(1100px,94vw);margin:auto;padding:28px 0}.center{text-align:center}.panel{background:#ffffff18;border:1px solid #ffffff30;backdrop-filter:blur(14px);border-radius:24px;padding:26px;margin:16px auto;box-shadow:0 18px 50px #0602224a}.compact{max-width:560px}.logo{font-size:clamp(36px,6vw,76px);font-weight:1000;letter-spacing:-.06em;text-shadow:0 6px 0 #3c1768}.lead{color:#ded1ff;font-size:18px}.muted{color:#c6b9ea}.hidden{display:none!important}.stack{display:grid;gap:12px}.row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}.between{justify-content:space-between}.tag{display:inline-block;background:#ffffff27;border:1px solid #ffffff3a;border-radius:100px;padding:7px 14px;font-weight:750}.bigcode{font-size:clamp(45px,8vw,100px);font-weight:1000;letter-spacing:.12em;margin:5px}.question{font-size:clamp(28px,4.5vw,58px);font-weight:900;line-height:1.25;margin:32px auto;max-width:1030px;overflow-wrap:anywhere}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.option{min-height:140px;border-radius:16px;color:white;text-align:left;display:flex;align-items:center;gap:18px;font-size:clamp(18px,2.5vw,30px);padding:24px;box-shadow:inset 0 -6px #0002;overflow-wrap:anywhere}.option.selected{outline:6px solid #fff}.option.correct{box-shadow:inset 0 0 0 7px #fff,0 0 35px #aafc62}.option.wrong{opacity:.45}.red{background:#de3153}.blue{background:#2379d8}.yellow{background:#c59504}.green{background:#238e62}.symbol{font-size:40px;flex:none}.timer{font-size:52px;font-weight:1000;background:#fff;color:#281550;width:100px;height:100px;display:grid;place-items:center;border-radius:50%;margin:auto}.scoreline{display:flex;justify-content:space-between;background:#fff;color:#271448;border-radius:15px;padding:13px 19px;margin:8px 0;font-weight:750;font-size:clamp(16px,2.7vw,28px);gap:15px;align-items:center}.rank{background:#38116d;color:#fff;border-radius:9px;padding:5px 14px}.rank:first-child{background:#ffcd3d}.gold{color:#ffe174}.tiny{font-size:13px}.qrbox{display:inline-block;background:white;padding:14px;border-radius:14px}.editrow{display:grid;grid-template-columns:1fr 100px 120px;gap:8px;margin:14px 0}.editing{margin:15px 0;padding:18px;background:#ffffff12;border-radius:16px}.optsedit{display:grid;grid-template-columns:1fr 1fr;gap:8px}.editing label{display:block;text-align:left;font-size:13px;margin:8px 0 4px;color:#e9dfff}.editing select{padding:12px;background:white;color:#251647;border-radius:10px}.podium{display:flex;justify-content:center;align-items:end;gap:12px;min-height:340px;padding-top:35px}.pod{width:min(28%,210px);text-align:center;animation:rise .8s cubic-bezier(.16,1,.3,1) both}.pod .block{display:flex;align-items:center;justify-content:center;color:#21123c;font-size:60px;font-weight:1000;border-radius:15px 15px 0 0;box-shadow:0 0 45px #fff3}.pod .name{font-weight:950;font-size:clamp(14px,2vw,26px);overflow-wrap:anywhere;margin-bottom:12px}.pod .medal{font-size:48px}.pod .points{font-size:17px;margin:7px}.pod:nth-child(1) .block{height:155px;background:linear-gradient(#e9f0ff,#9ea9c8)}.pod:nth-child(2) .block{height:230px;background:linear-gradient(#fff7a2,#ffba2d)}.pod:nth-child(3) .block{height:110px;background:linear-gradient(#ffca90,#bd7950)}.pod.hide-pod{visibility:hidden}.headline{font-size:clamp(30px,5vw,70px);font-weight:1000;line-height:1.1;color:#ffe15d;text-shadow:0 7px #7234ac}.winner{animation:bounce 1s ease-in-out infinite alternate}@keyframes bounce{to{transform:translateY(-12px)}}@keyframes rise{from{transform:translateY(110px);opacity:0}to{transform:translateY(0);opacity:1}}.toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#fff;color:#261443;border-radius:15px;padding:13px 18px;z-index:9;max-width:95vw;box-shadow:0 5px 25px #0006}.subtle{opacity:.75}canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:5}hr{border:0;border-top:1px solid #ffffff30;margin:25px 0}@media(max-width:650px){.wrap{padding:15px 0}.panel{padding:17px}.answers{gap:9px}.option{min-height:124px;padding:13px;flex-direction:column;align-items:flex-start;justify-content:center;font-size:17px}.symbol{font-size:27px}.editrow{grid-template-columns:1fr}.podium{min-height:260px}.pod:nth-child(1) .block{height:100px}.pod:nth-child(2) .block{height:160px}.pod:nth-child(3) .block{height:80px}}
.mediaimg{text-align:center;margin:-12px auto 18px}.mediaimg img{max-height:260px;max-width:min(550px,85vw);border-radius:16px;object-fit:contain;box-shadow:0 14px 40px #0005}</style></head><body><canvas id="confetti"></canvas><main id="app" class="wrap"></main><script>
'use strict';
const SAMPLE=[{"text":"진보당 성평등강령은 성평등을 여성만의 문제가 아니라 민주주의와 사회대전환의 핵심 가치로 본다.","options":["그렇다","아니다","",""],"correct":0,"seconds":20},{"text":"2026 6.3지방선거에서 진보당 기초의원은 총 34명이 당선되었다. 이중 여성당선자 비율은?","options":["38.7%","58.8%","51.3%","62.2%"],"correct":1,"seconds":30},{"text":"진보당 성평등강령에서 가장 강조하는 것은 무엇일까?","options":["여성만을 위한 복지 확대","성평등위원회 권한만 강화한다.","성평등은 민주주의와 사회변혁의 핵심 가치이다.","여성 후보 비율만 높이면 된다."],"correct":2,"seconds":30},{"text":"다음 중 진보당 국회의원이 대표 발의한 성평등·성폭력·인권 관련 법안에 포함된 내용이 아닌 것은?","options":["남녀동수제","포괄적 차별금지법","성평등임금공시제","비동의강간죄(형법 개정안)"],"correct":0,"seconds":30},{"text":"성희롱 판단시 권력관계는 중요한 요인이다.","options":["그렇다","아니다","",""],"correct":0,"seconds":20},{"text":"아래 그림은 부산 '산업안전협회'에서 제작한 부채이다. 이에 대한 반응 중 진보당원 답지 않은 것은?","options":["이런! 여성의 몸을 도구화하는 성적대상화야.","어떻게 이런 부채를? 여성상품화 같아.","성인지 감수성이 부족한 거 아냐?","솔직하고 자유로운 표현같은데"],"correct":3,"seconds":30,"image":"assets/question6-fan.png"},{"text":"다음 중 내 말을 듣고 상대방이 불편하다고 했을 때 성인지감수성이 가장 높은 사람은?","options":["농담인데...","내 말이 불편했다면 이유를 듣고 배우겠다.","음...너무 예민한 걸.","이런 말 싫어하는구나. (되도록 말을 붙이지 않겠다고 결심)"],"correct":1,"seconds":30},{"text":"다음 중 진보당에 있는 기구는?","options":["젠더폭력대응센터","양성평등위원회","성고충상담센터","평등한 당원활동을 위한 위원회"],"correct":0,"seconds":20}];
const symbols=['▲','◆','●','■'],colors=['red','blue','yellow','green'];
const app=document.getElementById('app');let db=null,code='',role='',latest=null,selected=null,hostQuestions=structuredClone(SAMPLE),timer=null,poller=null,awardStep=0,awardTimers=[],offset=0;let soundOn=localStorage.getItem('qp_sound')!=='off',audioCtx=null,lastStage='',pending=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
const qs=id=>document.getElementById(id);const btn=(text,fn,style='primary')=>`<button class="${style}" onclick="${fn}">${text}</button>`;
function showIssue(msg){let el=document.getElementById("qp-issue");if(!el){el=document.createElement("div");el.id="qp-issue";el.style.cssText="position:fixed;bottom:12px;left:12px;right:12px;background:#fff0f3;color:#84213e;border:3px solid #ef577b;padding:18px;border-radius:12px;z-index:9999;font-size:15px;box-shadow:0 0 25px #0007";document.body.appendChild(el)}el.textContent="⚠️ 서버 요청 오류: "+msg+" — 이 문구를 캡처해 주세요.";}
function clearIssue(){document.getElementById("qp-issue")?.remove()}
function toast(msg){const old=qs('toast');old?.remove();const el=document.createElement('div');el.id='toast';el.className='toast';el.textContent=msg;document.body.append(el);setTimeout(()=>el.remove(),4200)}
function tune(type){if(!soundOn)return;try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();let notes=type==='start'?[523,659,784,1047]:type==='correct'?[587,784,988]:type==='tick'?[880]:type==='reveal'?[392,523,659]:type==='award'?[392,523,659,784,1047,1319]:[440,370];notes.forEach((n,i)=>{let t=audioCtx.currentTime+i*(type==='award'?.16:.095),o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type==='award'?'triangle':'sine';o.frequency.setValueAtTime(n,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.15,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+.24)})}catch(e){}}
function burst(){const cv=qs('confetti'),cx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;const bits=Array.from({length:240},()=>({x:Math.random()*cv.width,y:-Math.random()*300,v:2+Math.random()*6,a:Math.random()*6.28,c:['#ffe65e','#ef469a','#5cebd9','#ffffff','#b986ff'][Math.floor(Math.random()*5)]}));let frame=0;function draw(){cx.clearRect(0,0,cv.width,cv.height);bits.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.a+frame/13);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,8,5)});if(frame++<240)requestAnimationFrame(draw);else cx.clearRect(0,0,cv.width,cv.height)}draw()}
function soundButton(){return btn(soundOn?'🔊 음향 켜짐':'🔇 음향 꺼짐','toggleSound()','secondary')};window.toggleSound=()=>{soundOn=!soundOn;localStorage.setItem('qp_sound',soundOn?'on':'off');tune('start');render()};
function setup(){
  // A host's QR includes only the public Supabase URL and publishable/anon key.
  // This avoids asking each participant to enter server settings.
  const params=new URLSearchParams(location.search);
  const receivedUrl=params.get('u'),receivedKey=params.get('k');
  if(receivedUrl&&receivedKey&&/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(receivedUrl)){
    localStorage.setItem('qp_url',receivedUrl);
    localStorage.setItem('qp_key',receivedKey);
    // Remove the connection parameters from the browser address after storing them.
    const clean=new URL(location.href);clean.searchParams.delete('u');clean.searchParams.delete('k');
    history.replaceState(null,'',clean.pathname+clean.search+clean.hash);
  }
  const url=localStorage.getItem('qp_url')||'',key=localStorage.getItem('qp_key')||'';
  if(!url||!key)return false;
  try{db=supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true}});return true}catch(e){return false}
}
function header(label=''){return `<div class="row between"><b style="font-size:23px">🎉 팡팡 QUIZ LIVE</b><span class="tag">${esc(label)}</span>${soundButton()}</div>`}
function setupView(){app.innerHTML=`${header('최초 1회 설정')}<section class="panel compact stack"><h1>무료 서버 연결</h1><p class="muted">Supabase 프로젝트 주소와 <b>publishable / anon</b> 키를 입력하세요. <b>service_role / secret 키는 절대 넣지 마세요.</b></p><input id="url" placeholder="https://프로젝트.supabase.co" value="${esc(localStorage.getItem('qp_url')||'')}"><input id="key" placeholder="Supabase publishable 또는 anon 키" value="${esc(localStorage.getItem('qp_key')||'')}">${btn('설정 저장하고 시작','saveSetup()')}<small>schema.sql을 SQL Editor에서 먼저 실행해야 합니다. 운영 방법은 README.md를 확인하세요.</small></section>`}
window.saveSetup=()=>{let u=qs('url').value.trim(),k=qs('key').value.trim();if(!/^https:\/\/.+\.supabase\.co$/.test(u)||!k){toast('주소 또는 키를 확인하세요');return}localStorage.setItem('qp_url',u);localStorage.setItem('qp_key',k);setup();home()};
function home(){stopPolling();role='';code='';app.innerHTML=`${header('120명 실시간 참여')}<div class="center" style="padding:50px 0 18px"><div class="logo">팡팡! 퀴즈 LIVE</div><p class="lead">정답도 빠르게, 웃음도 크게! 🎊</p></div><div class="panel compact stack center">${btn('🎤 진행자 모드','hostLogin()')} ${btn('📱 참가자 입장','joinView()','secondary')}<p class="muted tiny">별도 앱 설치 없이 브라우저로 참여</p></div>`;const params=new URLSearchParams(location.search);if(params.has('room'))joinView(params.get('room'))}
window.hostLogin=()=>{app.innerHTML=`${header('진행자 로그인')}<section class="panel compact stack"><h2>🎤 진행자 로그인</h2><p class="muted">Supabase Authentication에 미리 등록한 이메일 계정을 사용합니다.</p><input id="email" type="email" placeholder="이메일"><input id="password" type="password" placeholder="비밀번호">${btn('로그인','doHostLogin()')}${btn('처음으로','home()','secondary')}</section>`};
window.doHostLogin=async()=>{try{const {error}=await db.auth.signInWithPassword({email:qs('email').value.trim(),password:qs('password').value});if(error)throw error;role='host';editor()}catch(e){toast(e.message)}};
function editor(){app.innerHTML=`${header('문제 편집')}<h1>🎨 8문제 만들기</h1><div class="panel"><label>행사 제목</label><input id="title" value="우리들의 퀴즈 파티"><div class="row" style="margin:12px 0">${btn('📄 JSON 파일 가져오기','importFile()','secondary')}${btn('⬇ 문제 양식 다운로드','downloadSample()','secondary')}</div><input type="file" id="file" accept=".json" style="display:none" onchange="loadFile(event)"><div id="editors"></div><div class="row">${btn('🚀 퀴즈 방 만들기','makeRoom()')} ${btn('처음으로','home()','secondary')}</div></div>`;drawEditor()}
function drawEditor(){qs('editors').innerHTML=hostQuestions.map((q,i)=>`<div class="editing"><h3>${i+1}번 문제</h3><label>문제</label><textarea id="q${i}" rows="2">${esc(q.text)}</textarea><div class="optsedit">${q.options.map((o,j)=>`<div><label>${symbols[j]} ${j+1}번 보기</label><input id="o${i}_${j}" value="${esc(o)}"></div>`).join('')}</div><div class="row" style="margin:12px 0"><label>정답 <select id="c${i}">${[0,1,2,3].map(j=>`<option value="${j}" ${j===q.correct?'selected':''}>${j+1}번</option>`).join('')}</select></label><label>제한시간 <select id="s${i}">${[10,15,20,30,45,60].map(t=>`<option value="${t}" ${t===q.seconds?'selected':''}>${t}초</option>`).join('')}</select></label></div></div>`).join('')}
function collect(){return hostQuestions.map((_,i)=>({text:qs('q'+i).value.trim(),options:[0,1,2,3].map(j=>qs(`o${i}_${j}`).value.trim()),correct:Number(qs('c'+i).value),seconds:Number(qs('s'+i).value),...(hostQuestions[i].image?{image:hostQuestions[i].image}:{})}))}
window.downloadSample=()=>{let data;try{data=collect()}catch(e){data=hostQuestions}let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='quiz-8-questions.json';a.click();URL.revokeObjectURL(a.href)};
window.importFile=()=>qs('file').click();window.loadFile=async e=>{try{let data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data)||data.length!==8||data.some(x=>typeof x.text!=='string'||!Array.isArray(x.options)||x.options.length!==4||![0,1,2,3].includes(Number(x.correct))))throw Error('정확히 8문제, 각 4보기, correct 0~3 형식이어야 합니다');hostQuestions=data.map(x=>({...x,correct:Number(x.correct),seconds:Number(x.seconds)||20}));drawEditor();toast('문제 8개를 불러왔습니다')}catch(err){toast(err.message)}};
async function rpc(name,args){const {data,error}=await db.rpc(name,args);if(error)throw new Error(name+': '+error.message);return data}
window.makeRoom=async()=>{if(pending)return;pending=true;try{let q=collect();if(q.some(x=>!x.text||x.options.filter(a=>a.trim()).length<2))throw Error('모든 문제와 보기를 입력해야 합니다');let result=await rpc('qp_create',{p_title:qs('title').value,p_questions:q});code=result.code;role='host';latest=null;lastStage='';startPolling();toast('방 생성 성공!')}catch(e){toast(e.message)}finally{pending=false}};
window.joinView=async(c='')=>{const {data}=await db.auth.getSession();if(!data.session){const {error}=await db.auth.signInAnonymously();if(error){toast('익명 로그인을 활성화하세요: '+error.message);return}}app.innerHTML=`${header('참가자 입장')}<section class="panel compact stack center"><h1>📱 퀴즈 입장</h1><input id="joincode" placeholder="6자리 입장 코드" maxlength="6" inputmode="numeric" value="${esc(c)}"><input id="nickname" placeholder="닉네임 (2~20자)" maxlength="20">${btn('신나게 입장! 🚀','joinRoom()')}${btn('처음으로','home()','secondary')}</section>`};
window.joinRoom=async()=>{if(pending)return;pending=true;try{let c=qs('joincode').value.trim(),n=qs('nickname').value.trim();await rpc('qp_join',{p_code:c,p_nickname:n});code=c;role='player';latest=null;lastStage='';startPolling()}catch(e){toast(e.message)}finally{pending=false}};
function stopPolling(){clearInterval(poller);clearInterval(timer);awardTimers.forEach(clearTimeout);awardTimers=[];poller=null;timer=null}
function startPolling(){stopPolling();refresh();poller=setInterval(()=>{if(!pending)refresh()},role==='host'?1800:3200)}
let refreshBusy=false;async function refresh(){if(!code||!role||refreshBusy)return;refreshBusy=true;try{let data=await rpc('qp_state',{p_code:code});clearIssue();let stamp=`${data.phase}:${data.idx}:${data.phase_at}`;let wasNew=stamp!==lastStage;latest=data;offset=(new Date(data.server_at).getTime()-Date.now());if(wasNew){lastStage=stamp;selected=data.me?.choice??null;awardStep=0;render();if(data.phase==='question')tune('start');if(data.phase==='reveal')tune('reveal');if(data.phase==='final'){tune('award');burst();revealAwards()}}else updateLive()}catch(e){showIssue(e.message)}finally{refreshBusy=false}}
function deadline(){if(!latest?.question)return 0;return new Date(latest.phase_at).getTime()+latest.question.seconds*1000}
function remain(){return Math.max(0,Math.ceil((deadline()-Date.now()-offset)/1000))}
function media(q){return q&&q.image==='assets/question6-fan.png'?'<div class="mediaimg"><img src="question6-fan.png" onerror="this.onerror=null;this.src=\'assets/question6-fan.png\'" alt="6번 문제 부채 사진"></div>':''}
function render(){if(!latest)return;clearInterval(timer);const d=latest;let content='';if(d.phase==='lobby'){content=`<div class="center"><div class="headline">어서 오세요! 🎉</div><h2>${esc(d.title)}</h2><div class="bigcode">${esc(code)}</div><p>입장 인원 <b id="playerCount">${d.count}</b> / 120명</p>${role==='host'?`<div class="qrbox" id="qr"></div><p class="muted">카메라로 QR코드를 찍고 입장하세요</p>${btn('🎬 퀴즈 시작!','control("start")')}`:`<h2>✅ 입장 완료!</h2><p>닉네임: ${esc(d.me?.nickname)}</p><p>진행자가 시작할 때까지 기다려 주세요.</p>`}</div>`}
else if(d.phase==='question'){content=`<div class="row between"><span class="tag">문제 ${d.idx+1} / ${d.total}</span><span class="tag">답변 <b id="answered">${d.answered}</b> / <b id="players">${d.count}</b></span></div><div class="timer" id="timer">${remain()}</div><div class="question center">${esc(d.question.text)}</div>${media(d.question)}<div class="answers">${d.question.options.map((o,i)=>!o?'':`<button class="option ${colors[i]} ${selected===i?'selected':''}" ${role==='host'||selected!==null||remain()===0?'disabled':''} onclick="answer(${i})"><span class="symbol">${symbols[i]}</span><span>${esc(o)}</span></button>`).join('')}</div><div class="center" style="margin-top:20px">${role==='host'?btn('👀 정답 발표','control("reveal")'):`<span class="lead" id="hint">${selected===null?'정답을 터치하세요!':'✅ 제출 완료! 응원 중…'}</span>`}</div>`}
else if(d.phase==='reveal'){content=`<div class="tag">문제 ${d.idx+1} 정답 공개!</div><div class="question center">${esc(d.question.text)}</div>${media(d.question)}<div class="answers">${d.question.options.map((o,i)=>!o?'':`<div class="option ${colors[i]} ${i===d.question.correct?'correct':'wrong'}"><span class="symbol">${symbols[i]}</span><span>${esc(o)} ${i===d.question.correct?'✅':''}</span></div>`).join('')}</div><h2 class="center">${['역시! 눈썰미가 살아있네요 👀','맞힌 분들, 오늘 감 좋으신데요? 🎯','틀려도 괜찮아요. 아직 뒤집을 수 있어요!'][d.idx%3]}</h2>${role==='host'?`<div class="center">${btn('🏆 현재 순위 공개','control("leaderboard")')}</div>`:''}`}
else if(d.phase==='leaderboard'){content=`<div class="center"><div class="headline">🔥 순위가 춤춘다!</div><p class="lead">${d.idx+1}문제 완료 · 누적 점수 TOP 5</p></div><div class="panel compact">${scores(d.top)}</div>${role==='host'?`<div class="center">${btn(d.idx+1===d.total?'🎆 최종 시상식 시작':'➡ 다음 문제 시작','control("next")')}</div>`:`<p class="center lead">내 현재 순위: ${d.me?.rank}위 · ${d.me?.points}점</p>`}`}
else if(d.phase==='final'){content=`<div class="center"><div class="headline winner">🏆 오늘의 퀴즈 왕! 🏆</div><h2>두근두근… 영광의 시상식!</h2><p id="awardLine" class="lead">드디어 승리의 주인공을 공개합니다…</p><div class="podium">${[1,0,2].map((rank,j)=>{const x=d.top[rank];return `<div id="pod${rank}" class="pod hide-pod"><div class="medal">${['🥇','🥈','🥉'][rank]}</div><div class="name">${x?esc(x.nickname):'—'}</div><div class="points">${x?x.points.toLocaleString()+'점':''}</div><div class="block">${rank+1}</div></div>`}).join('')}</div><div id="allRanks" class="hidden panel compact"><h2>🎊 최종 전체 순위</h2>${scores(d.top)}</div>${role==='host'?`<div class="row" style="margin-top:25px">${btn('🎺 시상식 다시 보기','restartAwards()','secondary')}${btn('🎉 폭죽 발사!','fireConfetti()','secondary')}${btn('📋 결과 CSV 저장','exportCsv()','secondary')}</div>`:`<p class="lead">나의 최종 기록: <b>${d.me?.rank}위</b> · ${d.me?.points}점</p>`}</div>`}
app.innerHTML=header(role==='host'?'🎤 진행자 화면':'📱 참가자 화면')+`<div style="margin-top:24px">${content}</div>`;
if(d.phase==='lobby'&&role==='host'){let link=new URL(location.pathname,location.origin);
  link.searchParams.set('room',code);
  link.searchParams.set('u',localStorage.getItem('qp_url')||'');
  link.searchParams.set('k',localStorage.getItem('qp_key')||'');
  try{new QRCode(qs('qr'),{text:link.toString(),width:270,height:270,correctLevel:QRCode.CorrectLevel.L})}catch(e){qs('qr').textContent=link.toString()}}
if(d.phase==='question'){timer=setInterval(()=>{let el=qs('timer');if(el){let s=remain();el.textContent=s;if(s===5)tune('tick');if(s===0&&role==='player'&&selected===null){document.querySelectorAll('.option').forEach(x=>x.disabled=true);let h=qs('hint');if(h)h.textContent='⏰ 시간 종료!'}}},1000)}if(d.phase==='final'&&awardStep>0)showAwards(awardStep)}
function scores(rows){return (rows||[]).map((x,i)=>`<div class="scoreline"><span><span class="rank">${x.rank}위</span> ${i===0?'👑 ':''}${esc(x.nickname)}</span><b>${Number(x.points).toLocaleString()}점</b></div>`).join('')||'<p>아직 참가자가 없습니다.</p>'}
function updateLive(){if(!latest)return;const d=latest;if(d.phase==='lobby'){let el=qs('playerCount');if(el)el.textContent=d.count}if(d.phase==='question'){let a=qs('answered'),p=qs('players');if(a)a.textContent=d.answered;if(p)p.textContent=d.count}}
window.answer=async i=>{if(role!=='player'||selected!==null||remain()===0)return;selected=i;tune('correct');render();try{await rpc('qp_answer',{p_code:code,p_choice:i});toast('답변이 접수되었어요! 🎯')}catch(e){selected=null;render();toast(e.message)}};
window.control=async action=>{if(pending)return;pending=true;try{const result=await rpc('qp_control',{p_code:code,p_action:action});clearIssue();pending=false;await refresh();if(latest?.phase=== 'lobby' && action==='start')showIssue('시작 요청 후에도 로비 상태입니다. 서버 권한을 확인해야 합니다.');}catch(e){showIssue(e.message)}finally{pending=false}};
function showAwards(step){let lines=['','🥉 3위! 박수 짝짝짝!','🥈 2위! 아깝지만 눈부신 실력!','🥇 대망의 1위! 오늘 지식왕은 바로 당신!','🎊 모두 축하합니다! 오늘의 주인공은 우리 모두!'];[2,1,0].forEach((rank,i)=>{let x=qs('pod'+rank);if(x)x.classList.toggle('hide-pod',step<i+1)});let l=qs('awardLine');if(l)l.textContent=lines[Math.min(4,step)];let all=qs('allRanks');if(all)all.classList.toggle('hidden',step<4)}
function revealAwards(){awardTimers.forEach(clearTimeout);awardTimers=[];[1,2,3,4].forEach((s,i)=>awardTimers.push(setTimeout(()=>{awardStep=s;showAwards(s);tune('award');if(s===3||s===4)burst()},(i+1)*2400)))}
window.restartAwards=()=>{awardStep=0;showAwards(0);revealAwards()};window.fireConfetti=()=>{burst();tune('award')};
window.exportCsv=()=>{if(!latest)return;const csv='\ufeff순위,닉네임,점수\n'+latest.top.map(x=>`${x.rank},"${x.nickname.replace(/"/g,'""')}",${x.points}`).join('\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=`quiz-results-${code}.csv`;a.click();URL.revokeObjectURL(url)};
try{if(setup())home();else setupView()}catch(e){showIssue('초기화: '+e.message)}
</script></body></html>
